    <!-- Termina Campo de busqueda-->

     <div class="mt-4">

 <script>

     const PRODUCTS = [

  { id: "s2", name: "Veggie Grill",  price: 280, category: "Sándwiches", img: "🥗", desc: "Verduras asadas." }
];

const listaProductos = document.getElementById('listaProductos');
    function listarProductos(productos){       
       

        for(const producto of productos){
            const test = `<div><h3>${producto.name + " "+ producto.img}</h3></div>`
            listaProductos.innerHTML = test;

         
            const precio = `<p>${producto.price}</p>`;
            listaProductos.innerHTML += precio;
         

            const categoria = `<p>`document.createElement('p');
            categoria.textContent = producto.category;

            const descripcion = document.createElement('p');
            descripcion.textContent = producto.desc;
            
            div.appendChild(titulo);
            div.appendChild(precio);
            div.appendChild(categoria);
            div.appendChild(descripcion);
            
            listaProductos.appendChild(div);  
        }
    }

    listarProductos(PRODUCTS);
 </script>
